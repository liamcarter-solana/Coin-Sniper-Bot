<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/img/logo.svg" />
    <link rel="stylesheet" href="/styles/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <script>
      /*
       * LOCAL ANALYSIS VERSION
       *
       * The original page contacted an external API to obtain a user.
       * This local version does not contact that service.
       *
       * Instead, it creates a harmless dummy user locally and stores it
       * using the same localStorage keys used by the original page.
       */

      function initializeLocalUser() {
        const testUser = {
          id: "local-test-user",
          username: "local-analysis",
          email: "local@example.invalid",
          name: "Local Test User",
          local: true
        };

        window.localStorage.setItem(
          "auth",
          JSON.stringify(testUser)
        );

        window.localStorage.setItem(
          "data",
          JSON.stringify({})
        );

        /*
         * Give the browser a moment to finish loading the page before
         * navigating to the local application.
         */
        window.location.href = "/";
      }

      window.addEventListener("DOMContentLoaded", initializeLocalUser);
    </script>

    <title>Coin Sniper Bot - Local Test</title>
  </head>

  <body>
    <div class="register">
      <div class="container447">
        <div class="register__inner">

          <div class="register__logo">
            <img src="/img/logo_big.svg" alt="Logo" />
          </div>

          <div
            class="register__title"
            style="text-align: center;"
          >
            Initializing local test environment...
          </div>

        </div>
      </div>
    </div>
  </body>
</html>
